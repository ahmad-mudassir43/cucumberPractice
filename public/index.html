<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialConnect - Connect with Friends</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-left">
            <div class="brand">
                <h1><i class="fas fa-users"></i> SocialConnect</h1>
                <p>Connect with friends and the world around you on SocialConnect.</p>
            </div>
            <div class="features">
                <div class="feature">
                    <i class="fas fa-share-alt"></i>
                    <span>Share your moments</span>
                </div>
                <div class="feature">
                    <i class="fas fa-heart"></i>
                    <span>Stay connected</span>
                </div>
                <div class="feature">
                    <i class="fas fa-comments"></i>
                    <span>Chat with friends</span>
                </div>
            </div>
        </div>
        
        <div class="auth-right">
            <div class="auth-forms">
                <!-- Login Form -->
                <div id="loginForm" class="form-container active">
                    <h2>Welcome Back</h2>
                    <p>Sign in to your account</p>
                    
                    <form id="loginFormElement">
                        <div class="form-group">
                            <label for="loginUsername">Username or Email</label>
                            <input type="text" id="loginUsername" name="username" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="loginPassword">Password</label>
                            <input type="password" id="loginPassword" name="password" required>
                        </div>
                        
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-sign-in-alt"></i> Sign In
                        </button>
                    </form>
                    
                    <p class="toggle-form">
                        Don't have an account? 
                        <a href="#" onclick="toggleForm()">Sign up</a>
                    </p>
                </div>
                
                <!-- Registration Form -->
                <div id="registerForm" class="form-container">
                    <h2>Join SocialConnect</h2>
                    <p>Create a new account</p>
                    
                    <form id="registerFormElement">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="firstName">First Name</label>
                                <input type="text" id="firstName" name="firstName" required>
                            </div>
                            <div class="form-group">
                                <label for="lastName">Last Name</label>
                                <input type="text" id="lastName" name="lastName" required>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="registerUsername">Username</label>
                            <input type="text" id="registerUsername" name="username" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="registerPassword">Password</label>
                            <input type="password" id="registerPassword" name="password" required minlength="6">
                        </div>
                        
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-user-plus"></i> Create Account
                        </button>
                    </form>
                    
                    <p class="toggle-form">
                        Already have an account? 
                        <a href="#" onclick="toggleForm()">Sign in</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Loading overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner">
            <i class="fas fa-spinner fa-spin"></i>
            <p>Please wait...</p>
        </div>
    </div>
    
    <!-- Toast notifications -->
    <div id="toast" class="toast"></div>
    
    <script src="auth.js"></script>
</body>
</html>
